<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>/* __CSS__ */</style>
</head>
<body>
  <div id="titlebar">
    <div class="titlebar-actions">
      <button id="btn-new" data-i18n-title="new" title="New (Ctrl+N)">
        <svg viewBox="0 0 16 16" fill="none"><path d="M4 1.5h5.5L13 5v9.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.2"/><path d="M9 1.5V5h3.5" stroke="currentColor" stroke-width="1.2"/><path d="M6 9h4M8 7v4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-open" data-i18n-title="open" title="Open (Ctrl+O)">
        <svg viewBox="0 0 16 16" fill="none"><path d="M2 13V4.5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="btn-save" data-i18n-title="save" title="Save (Ctrl+S)">
        <svg viewBox="0 0 16 16" fill="none"><path d="M3 1.5h8.5L14 4v9.5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-12a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.2"/><rect x="5" y="1.5" width="5" height="4" rx="0.5" stroke="currentColor" stroke-width="1.2"/><rect x="4.5" y="9" width="7" height="4.5" rx="0.5" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <div class="titlebar-sep"></div>
      <button id="btn-toggle" data-i18n-title="toggle" title="Toggle Preview (Ctrl+E)">
        <svg id="icon-preview" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.2"/></svg>
        <svg id="icon-edit" viewBox="0 0 16 16" fill="none" style="display:none"><path d="M11.5 1.5l3 3L5 14H2v-3L11.5 1.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M9.5 3.5l3 3" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="btn-split" data-i18n-title="split" title="Split View (Ctrl+\)">
        <svg viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5" stroke="currentColor" stroke-width="1.2"/><line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="btn-toc" data-i18n-title="outline" title="Outline (Ctrl+Shift+O)">
        <svg viewBox="0 0 16 16" fill="none"><path d="M3 3h10M3 6.5h7M3 10h8M3 13.5h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <span id="titlebar-title" data-i18n="untitled">Untitled</span>
    <div id="window-controls">
      <button id="btn-settings" data-i18n-title="settings" title="Settings" aria-expanded="false" aria-controls="settings-menu">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v1.2M8 13.3v1.2M1.5 8h1.2M13.3 8h1.2M3.4 3.4l.9.9M11.7 11.7l.9.9M12.6 3.4l-.9.9M4.3 11.7l-.9.9"/></svg>
      </button>
      <button id="btn-theme" data-i18n-title="theme" title="Toggle Theme">
        <svg id="icon-sun" viewBox="0 0 16 16" fill="none" style="display:none"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.2"/><path d="M8 2v1.5M8 12.5V14M2 8h1.5M12.5 8H14M3.75 3.75l1.06 1.06M11.19 11.19l1.06 1.06M3.75 12.25l1.06-1.06M11.19 4.81l1.06-1.06" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <svg id="icon-moon" viewBox="0 0 16 16" fill="none"><path d="M13.5 8.5a5.5 5.5 0 0 1-6-6 5.5 5.5 0 1 0 6 6z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </button>
      <div class="window-controls-sep"></div>
      <button id="btn-minimize" data-i18n-title="minimize" title="Minimize">
        <svg viewBox="0 0 10 10"><line x1="2" y1="5" x2="8" y2="5"/></svg>
      </button>
      <button id="btn-maximize" data-i18n-title="maximize" title="Maximize">
        <svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1"/></svg>
      </button>
      <button id="btn-close" data-i18n-title="close" title="Close">
        <svg viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg>
      </button>
    </div>
  </div>

  <div id="settings-menu" role="menu">
    <div class="settings-label" data-i18n="language">Language</div>
    <div class="settings-languages">
      <button type="button" data-language="zh-CN">中文</button>
      <button type="button" data-language="en">English</button>
    </div>
    <button type="button" id="settings-association" data-i18n="association">Set .md and .txt default apps…</button>
    <div class="settings-hint" data-i18n="associationHelp">Choose Peekdown for each extension in Windows Settings.</div>
  </div>

  <div id="tab-bar"></div>

  <div id="find-bar">
    <input id="find-input" type="text" data-i18n-placeholder="find" placeholder="Find..." spellcheck="false">
    <span id="find-count"></span>
    <button id="find-prev" data-i18n-title="previous" title="Previous (Shift+Enter)">
      <svg viewBox="0 0 10 10"><polyline points="2,7 5,3 8,7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="find-next" data-i18n-title="next" title="Next (Enter)">
      <svg viewBox="0 0 10 10"><polyline points="2,3 5,7 8,3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="find-close" data-i18n-title="closeFind" title="Close (Escape)">
      <svg viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg>
    </button>
  </div>

  <div id="content">
    <div id="toc-panel">
      <div id="toc-list"></div>
    </div>
    <div id="editor-container" class="active">
      <div id="recent-panel"></div>
      <textarea id="editor" data-i18n-placeholder="startWriting" placeholder="Start writing markdown..." spellcheck="false"></textarea>
    </div>

    <div id="preview-container">
      <div id="preview-wrapper">
        <div id="preview"></div>
        <div id="preview-resize-handle"></div>
      </div>
    </div>
  </div>

  <div id="zoom-toast"></div>

  <div id="drop-overlay">
    <div class="drop-message" data-i18n="drop">Drop to open</div>
  </div>

  <div id="statusbar">
    <span id="status-mode" data-i18n="edit">EDIT</span>
    <span id="status-file" data-i18n="untitled">Untitled</span>
    <span id="status-counts"></span>
    <span id="status-info"></span>
  </div>

  <!-- __SCRIPTS__ -->
</body>
</html>
