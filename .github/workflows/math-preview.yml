name: Math preview

on:
  push:
    branches: [feat/latex-math-katex]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve pinned math dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Prepare source snapshot for integration checks
        run: tar -czf /tmp/peekdown-math-inputs.tar.gz --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: peekdown-math-inputs
          path: /tmp/peekdown-math-inputs.tar.gz
          retention-days: 1
